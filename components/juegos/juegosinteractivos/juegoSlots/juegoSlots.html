<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mini Slot</title>
</head>

<body>
    <div class="slots">
        <div id="view_pre" class="view_pre">
            <img src="/resources/Icono_slots_start.png" alt="Aladdin">
            <br />
            <button id="btn_start_game" title="Jugar Slots" class="btn-design1">Jugar</button>
        </div>
        <div id="content_game_all" class="container">
            <div class="slot-container">
                <div class="slot-img">
                    <h1 class="type2-h1">LOS SLOTS DE</h1>
                    <img src="/resources/casino_aladdin_blanco.png" />
                </div>
                <section class="_content_divider_section container">
                    <div class="_divider_game_">
                        <div class="progress-fill-game"></div>
                    </div>
                    <div class="_figura_divider_"></div>
                </section>
                <!-- <div class="divider-actions"></div> -->
                <br />
                <br />
                <br />
                <div class="reels">
                    <div class="reel" id="reel1"></div>
                    <div class="reel" id="reel2"></div>
                    <div class="reel" id="reel3"></div>
                </div>
                <br />
                <br />
                <br />
                <div style="display: flex;justify-content: center;align-items: center; width: 100%;">
                    <img src="/resources/colore_mquina.png" alt="Aladdin">
                </div>
                <section class="_content_divider_section container">
                    <div class="_divider_game_">
                        <div class="progress-fill-game"></div>
                    </div>
                    <div class="_figura_divider_"></div>
                </section>
                <!-- <div class="divider-actions"></div> -->
                <div class="content-actions">
                    <div class="bloque-lateral"></div>
                    <div class="part_mid">
                        <p>SALDO <span id="saldo"></span></p>
                        <br />
                        <p>APUESTA <span id="apuesta"></span></p>
                    </div>
                    <div class="control_coins">
                        <img title="Ficha $ 10.000" id="ficha_10" src="/resources/poker-chip-10.png" alt="Aladdin"
                            data-valor="10000">
                        <img title="Ficha $ 25.000" id="ficha_25" src="/resources/poker-chip-25.png" alt="Aladdin"
                            data-valor="25000">
                        <img title="Ficha $ 50.000" id="ficha_50" src="/resources/poker-chip-50.png" alt="Aladdin"
                            data-valor="50000">
                        <img title="Ficha $ 100.000" id="ficha_100" src="/resources/poker-chip-100.png" alt="Aladdin"
                            data-valor="100000">
                        <img title="Ficha $ 250.000" id="ficha_250" src="/resources/poker-chip-250.png" alt="Aladdin"
                            data-valor="250000">
                    </div>
                </div>
                <div style="height: 5vh;" class="message" id="message"></div>
                <div class="content_palanca">
                    <div class="sopor_palanca"></div>
                    <img class="img_palanca" id="spinBtn" title="Girar" src="/resources/slots/palanca.png"
                        alt="Aladdin">
                </div>
                <div class="torni_1">
                    <div class="sep_1"></div>
                    <div class="sep_2"></div>
                </div>
                <div class="torni_2">
                    <div class="sep_1"></div>
                    <div class="sep_2"></div>
                </div>
                <div class="torni_3">
                    <div class="sep_1"></div>
                    <div class="sep_2"></div>
                </div>
                <div class="torni_4">
                    <div class="sep_1"></div>
                    <div class="sep_2"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
