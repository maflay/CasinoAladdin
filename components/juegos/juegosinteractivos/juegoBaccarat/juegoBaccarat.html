<!DOCTYPE html>
<html>

<head>
    <title>Aladdin: Baccarat</title>
</head>

<body>
    <section class="content_main_baccarat">
        <div id="pre_view_bac" class="pre_view_bac">
            <img class="img_game" src="/resources/cartas/logo_entrada_baccarat.png" alt="Aladdin">
            <button title="Jugar Baccarat" onclick="startGame()" class="btn-design1">Jugar</button>
        </div>
        <div id="content_game_all" class="content_game_all container">
            <div class="content_juego_open">
                <div class="content_head">
                    <h2 class="type1-h1 title_game">Baccarat - <img class="img_game" src="/resources/ala_blanco.png"
                            alt="aladdin">
                    </h2>
                    <button title="Instrucciones" id="btn_abrir_modal"
                        class="btn_rules btn-design1">Instrucciones</button>
                </div>
            </div>
            <div class="baccarat_content">
                <div
                    style="width: 5px;height: 100%;background-color: white;position: absolute;top: 0;left: 50%; transform: translateX(-50%);">
                </div>
                <div
                    style="height: 5px;width: 100%;background-color: white;position: absolute;top: 50%;left: 50%; transform: translateX(-50%);">
                </div>
                <div
                    style="width: 111%;height: 5px;background-color: white;position: absolute;top: 50%;left: 50%; transform: translateX(-50%) rotate(26deg);">
                </div>
                <div
                    style="width: 111%;height: 5px;background-color: white;position: absolute;top: 50%;left: 50%; transform: translateX(-50%) rotate(-26deg);">
                </div>
            </div>
        </div>
    </section>
</body>

</html>
